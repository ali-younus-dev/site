<link rel="canonical" href="https://fotilepk.com/moon-series/">
<script>
/* Legacy URL redirect. Uses RELATIVE paths so it works at a domain root,
   inside a subfolder (preview hosting), and straight from disk. */
(function(){var t="moon-series/";
 var p=location.pathname, f=(location.protocol==="file:");
 /* Some hosts serve foo.html for the URL /foo/ - if we are already inside the
    destination folder, load its real page instead of redirecting again. */
 if(t && p.slice(-t.length)===t){ location.replace("index.html"); return; }
 location.replace(f ? (t+"index.html") : (t||"./"));})();
</script>
